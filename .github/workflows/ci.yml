# =============================================================================
# Workflow: CI Pipeline - Dry Bean Classifier
# Repository: Workflow-CI
# Author: Rifqi (Muzhoffar)
#
# Tahapan sesuai referensi Dicoding (Advanced):
#   1.  Set up job                     (otomatis)
#   2.  Run actions/checkout@v3        (otomatis dari nama action)
#   3.  Set up Python 3.12.7           (otomatis dari setup-python)
#   4.  Check Env
#   5.  Install dependencies
#   6.  Run mlflow project
#   7.  Get latest MLflow run_id
#   8.  Install Python dependencies
#   9.  Upload to GitHub
#   10. Build Docker Model
#   11. Log in to Docker Hub           (otomatis dari nama action)
#   12. Tag Docker Image
#   13. Push Docker Image
#   14. Post Log in to Docker Hub      (otomatis)
#   15. Post Set up Python 3.12.7      (otomatis)
#   16. Post Run actions/checkout@v3   (otomatis)
#   17. Complete job                   (otomatis)
# =============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Step 2: Checkout repository
      # Nama otomatis tampil sebagai "Run actions/checkout@v3"
      # ----------------------------------------------------------
      - uses: actions/checkout@v3

      # ----------------------------------------------------------
      # Step 3: Setup Python
      # Nama otomatis tampil sebagai "Set up Python 3.12.7"
      # ----------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.13"

      # ----------------------------------------------------------
      # Step 4: Check Env
      # ----------------------------------------------------------
      - name: Check Env
        run: |
          python --version
          pip --version
          echo "Environment check selesai."

      # ----------------------------------------------------------
      # Step 5: Install dependencies
      # Hanya install MLflow dulu (untuk menjalankan mlflow run)
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.20.2

      # ----------------------------------------------------------
      # Step 6: Run mlflow project
      # ----------------------------------------------------------
      - name: Run mlflow project
        run: |
          mlflow run MLProject/ --env-manager=local -P n_estimators=100 -P max_depth=None -P min_samples_split=2 -P test_size=0.2 -P random_state=42

      # ----------------------------------------------------------
      # Step 7: Get latest MLflow run_id
      # Ambil run_id yang disimpan oleh modelling.py
      # ----------------------------------------------------------
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID yang digunakan: $RUN_ID"

      # ----------------------------------------------------------
      # Step 8: Install Python dependencies
      # Install library tambahan untuk build Docker
      # ----------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install pandas numpy scikit-learn matplotlib seaborn

      # ----------------------------------------------------------
      # Step 9: Upload to GitHub
      # Simpan artefak mlruns dan run_id ke repository
      # ----------------------------------------------------------
      - name: Upload to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns/
          git add MLProject/run_id.txt
          git diff --staged --quiet || git commit -m "ci: update mlruns artifacts [skip ci]"
          git push

      # ----------------------------------------------------------
      # Step 10: Build Docker Model
      # Build Docker image dari artefak model MLflow
      # ----------------------------------------------------------
      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "${{ secrets.DOCKERHUB_USERNAME }}/dry-bean-classifier" --env-manager local

      # ----------------------------------------------------------
      # Step 11: Log in to Docker Hub
      # Nama otomatis tampil sebagai "Log in to Docker Hub"
      # ----------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Step 12: Tag Docker Image
      # ----------------------------------------------------------
      - name: Tag Docker Image
        run: |
          docker tag \
            "${{ secrets.DOCKERHUB_USERNAME }}/dry-bean-classifier:latest" \
            "${{ secrets.DOCKERHUB_USERNAME }}/dry-bean-classifier:latest"
          echo "Image berhasil di-tag."

      # ----------------------------------------------------------
      # Step 13: Push Docker Image
      # ----------------------------------------------------------
      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/dry-bean-classifier:latest"
          echo "Docker image berhasil dipush."
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/dry-bean-classifier:latest"